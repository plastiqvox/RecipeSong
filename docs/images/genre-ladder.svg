<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 270" width="1600" height="270" role="img" aria-label="장르 칸은 Last.fm 태그, Discogs, Deezer 장르, 소리가 닮은 앨범 순서로 보고, 앞에서 정해지지 않을 때만 다음으로 넘어간다. 끝까지 모르면 인디·록.">
<style>
svg { --bg:#F1EAE1;--bgEdge:#E6DDD2;--ink:#23272D;--sub:#6E6A64;--faint:#A39C93;--line:#CFC5B8;--boxFill:#F6F1EB;--focus:#2F7FC1;--alert:#D9573F;--band:rgba(255,255,255,0.35);--ok:#3E9A63;--warn:#C9822B }
@media (prefers-color-scheme: dark) { svg { --bg:#191D23;--bgEdge:#21252B;--ink:#ECEEF1;--sub:#9AA1AB;--faint:#5C636D;--line:#3A414B;--boxFill:#1E2228;--focus:#50A6B7;--alert:#EB6F5C;--band:rgba(0,0,0,0.22);--ok:#6CC08B;--warn:#E3A857 } }
[data-theme="light"] svg, svg[data-theme="light"] { --bg:#F1EAE1;--bgEdge:#E6DDD2;--ink:#23272D;--sub:#6E6A64;--faint:#A39C93;--line:#CFC5B8;--boxFill:#F6F1EB;--focus:#2F7FC1;--alert:#D9573F;--band:rgba(255,255,255,0.35);--ok:#3E9A63;--warn:#C9822B }
[data-theme="dark"] svg, svg[data-theme="dark"] { --bg:#191D23;--bgEdge:#21252B;--ink:#ECEEF1;--sub:#9AA1AB;--faint:#5C636D;--line:#3A414B;--boxFill:#1E2228;--focus:#50A6B7;--alert:#EB6F5C;--band:rgba(0,0,0,0.22);--ok:#6CC08B;--warn:#E3A857 }
text { font-family: 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; }
.display { font-family: 'Black Han Sans', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; font-weight: 400; }
.mono { font-family: 'JetBrains Mono', Consolas, monospace; font-weight: 500; }
</style>
<defs><radialGradient id="bgGrad" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="var(--bg)"/><stop offset="0.45" stop-color="var(--bg)"/><stop offset="1" stop-color="var(--bgEdge)"/></radialGradient></defs><rect width="1600" height="270" rx="14" fill="url(#bgGrad)"/>
<text x="800" y="50" text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="500" fill="var(--sub)">앞에서 칸이 정해지지 않으면 다음으로</text>
<polyline points="386,150 454,150" fill="none" stroke="var(--sub)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 443 157 L 454 150 L 443 143" fill="none" stroke="var(--sub)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="766,150 834,150" fill="none" stroke="var(--sub)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 823 157 L 834 150 L 823 143" fill="none" stroke="var(--sub)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="1146,150 1214,150" fill="none" stroke="var(--sub)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1203 157 L 1214 150 L 1203 143" fill="none" stroke="var(--sub)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<g><rect x="80" y="109" width="300" height="82" rx="11" fill="var(--boxFill)" stroke="var(--focus)" stroke-width="2"/><text x="230" y="136.2" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="700" fill="var(--focus)">Last.fm</text><text x="230" y="166.39999999999998" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400" fill="var(--sub)">앨범 → 아티스트 태그</text></g>
<g><rect x="460" y="109" width="300" height="82" rx="11" fill="var(--boxFill)" stroke="var(--focus)" stroke-width="2"/><text x="610" y="136.2" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="700" fill="var(--focus)">Discogs</text><text x="610" y="166.39999999999998" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400" fill="var(--sub)">스타일 · 토큰 있을 때</text></g>
<g><rect x="840" y="109" width="300" height="82" rx="11" fill="var(--boxFill)" stroke="var(--line)" stroke-width="2"/><text x="990" y="136.2" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="700" fill="var(--ink)">Deezer 장르</text><text x="990" y="166.39999999999998" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400" fill="var(--sub)">Pop·Asian Music 제외</text></g>
<g><rect x="1220" y="109" width="300" height="82" rx="11" fill="var(--boxFill)" stroke="var(--focus)" stroke-width="2"/><text x="1370" y="136.2" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="700" fill="var(--focus)">닮은 앨범 15장</text><text x="1370" y="166.39999999999998" text-anchor="middle" dominant-baseline="central" font-size="18" font-weight="400" fill="var(--sub)">칸 아는 앨범끼리 투표</text></g>
<text x="1520" y="232" text-anchor="end" dominant-baseline="central" font-size="18" font-weight="500" fill="var(--sub)">끝까지 모르면 인디·록</text>
</svg>
