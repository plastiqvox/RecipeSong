<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 132" role="img" aria-label="장르 칸은 Last.fm 태그, Discogs, Deezer 장르, 소리 장르 태그, 소리가 닮은 앨범 순서로 보고, 앞에서 정해지지 않을 때만 다음으로 넘어간다. 끝까지 모르면 인디·록." width="820" height="132">
<style>
  svg { color: #1c2230; --surface: #ffffff; --line: #c3c9d4; --muted: #5b6474; --accent: #2456c9; --accent-soft: #e6edfb; }
  @media (prefers-color-scheme: dark) {
    svg { color: #e6e9ef; --surface: #1b2029; --line: #3a4252; --muted: #9aa3b2; --accent: #7ea4ff; --accent-soft: #1f2b47; }
  }
  .bg { fill: var(--surface); }
  .n { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
  .n.chg { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
  .t { fill: currentColor; font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 13.5px; font-weight: 700; }
  .s { fill: var(--muted); font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 11.5px; }
  .l { fill: var(--muted); font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 11px; }
  .e { fill: none; stroke: currentColor; stroke-width: 1.3; }
  .e.dash { stroke-dasharray: 5 4; }
  .ah { fill: currentColor; }
</style>
<rect class="bg" x="0" y="0" width="820" height="132" rx="10"/>
        <defs>
          <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" class="ah"/>
          </marker>
        </defs>
        <rect class="n chg" x="10" y="30" width="138" height="64" rx="8"/>
        <text class="t" x="79" y="56" text-anchor="middle">Last.fm</text>
        <text class="s" x="79" y="75" text-anchor="middle">앨범 → 아티스트 태그</text>

        <rect class="n chg" x="172" y="30" width="138" height="64" rx="8"/>
        <text class="t" x="241" y="56" text-anchor="middle">Discogs</text>
        <text class="s" x="241" y="75" text-anchor="middle">스타일 · 토큰 있을 때</text>

        <rect class="n" x="334" y="30" width="138" height="64" rx="8"/>
        <text class="t" x="403" y="56" text-anchor="middle">Deezer 장르</text>
        <text class="s" x="403" y="75" text-anchor="middle">Pop·Asian Music 제외</text>

        <rect class="n" x="496" y="30" width="138" height="64" rx="8"/>
        <text class="t" x="565" y="56" text-anchor="middle">소리 장르 태그</text>
        <text class="s" x="565" y="75" text-anchor="middle">EffNet 모델이 있을 때</text>

        <rect class="n chg" x="658" y="30" width="152" height="64" rx="8"/>
        <text class="t" x="734" y="56" text-anchor="middle">닮은 앨범 15장</text>
        <text class="s" x="734" y="75" text-anchor="middle">칸 아는 앨범끼리 투표</text>

        <line class="e" x1="148" y1="62" x2="170" y2="62" marker-end="url(#ar2)"/>
        <line class="e" x1="310" y1="62" x2="332" y2="62" marker-end="url(#ar2)"/>
        <line class="e" x1="472" y1="62" x2="494" y2="62" marker-end="url(#ar2)"/>
        <line class="e" x1="634" y1="62" x2="656" y2="62" marker-end="url(#ar2)"/>
        <text class="l" x="410" y="18" text-anchor="middle">앞에서 칸이 정해지지 않으면 다음으로 →</text>
        <text class="l" x="734" y="116" text-anchor="middle">끝까지 모르면 인디·록</text>
      </svg>
