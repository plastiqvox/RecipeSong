<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1505" width="1600" height="1505" role="img" aria-label="라이브러리 전체에서 시드와 내 곡 소리 기준을 만들고, 곡별 불호를 반영해 점수를 매긴다. 모든 출처에 공통 취향 기준을 적용하고 미분석·근거 부족은 확인 필요로 분리한다.">
