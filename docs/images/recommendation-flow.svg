text { font-family: 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; }
.display { font-family: 'Black Han Sans', 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; font-weight: 400; }
.mono { font-family: 'JetBrains Mono', Consolas, monospace; font-weight: 500; }
