<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 800" role="img" aria-label="라이브러리 전체에서 시드와 내 곡 소리 기준을 만들고, Deezer로 후보를 모아 미리듣기 소리를 비교해 점수를 매긴 뒤 장르 칸으로 나눠 보여 주는 흐름. AI와 웹진 앨범은 닮음 기준을 넘어야 보인다." width="820" height="800">
<style>
  svg { color: #1c2230; --surface: #ffffff; --line: #c3c9d4; --muted: #5b6474; --accent: #2456c9; --accent-soft: #e6edfb; }
  @media (prefers-color-scheme: dark) {
    svg { color: #e6e9ef; --surface: #1b2029; --line: #3a4252; --muted: #9aa3b2; --accent: #7ea4ff; --accent-soft: #1f2b47; }
  }
  .bg { fill: var(--surface); }
  .n { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
  .n.chg { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
  .t { fill: currentColor; font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 13.5px; font-weight: 700; }
  .s { fill: var(--muted); font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 11.5px; }
  .l { fill: var(--muted); font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 11px; }
  .e { fill: none; stroke: currentColor; stroke-width: 1.3; }
  .e.dash { stroke-dasharray: 5 4; }
  .ah { fill: currentColor; }
</style>
<rect class="bg" x="0" y="0" width="820" height="800" rx="10"/>
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" class="ah"/>
          </marker>
        </defs>

        <!-- 가운데 줄 -->
        <rect class="n" x="300" y="20" width="220" height="56" rx="8"/>
        <text class="t" x="410" y="44" text-anchor="middle">iTunes 라이브러리 전체</text>
        <text class="s" x="410" y="62" text-anchor="middle">플레이리스트와 상관없이</text>

        <rect class="n chg" x="300" y="120" width="220" height="56" rx="8"/>
        <text class="t" x="410" y="144" text-anchor="middle">시드 아티스트</text>
        <text class="s" x="410" y="162" text-anchor="middle">곡 가중치 합 상위 80명 + 하트·팔로우</text>

        <rect class="n" x="300" y="220" width="220" height="56" rx="8"/>
        <text class="t" x="410" y="244" text-anchor="middle">비슷한 아티스트 2단계</text>
        <text class="s" x="410" y="262" text-anchor="middle">Deezer 연관 · 상위 1,000명</text>

        <rect class="n" x="300" y="320" width="220" height="56" rx="8"/>
        <text class="t" x="410" y="344" text-anchor="middle">그 기간 발매작</text>
        <text class="s" x="410" y="362" text-anchor="middle">가진 앨범·차단 빼고</text>

        <rect class="n" x="300" y="420" width="220" height="56" rx="8"/>
        <text class="t" x="410" y="444" text-anchor="middle">미리듣기 소리 분석</text>
        <text class="s" x="410" y="462" text-anchor="middle">CLAP · 앨범당 최대 20곡</text>

        <rect class="n chg" x="300" y="520" width="220" height="56" rx="8"/>
        <text class="t" x="410" y="544" text-anchor="middle">점수</text>
        <text class="s" x="410" y="562" text-anchor="middle">1.5 × 닮음 + 연결 + 좋아요 − 별로 …</text>

        <rect class="n chg" x="300" y="620" width="220" height="56" rx="8"/>
        <text class="t" x="410" y="644" text-anchor="middle">장르 칸</text>
        <text class="s" x="410" y="662" text-anchor="middle">국적과 상관없이 6칸</text>

        <rect class="n" x="300" y="720" width="220" height="56" rx="8"/>
        <text class="t" x="410" y="744" text-anchor="middle">화면</text>
        <text class="s" x="410" y="762" text-anchor="middle">인디·록 · 일렉트로닉 · 힙합·R&amp;B …</text>

        <!-- 왼쪽 줄 -->
        <rect class="n chg" x="20" y="120" width="220" height="56" rx="8"/>
        <text class="t" x="130" y="144" text-anchor="middle">내 곡 소리 기준</text>
        <text class="s" x="130" y="162" text-anchor="middle">하트 1 · 90일+ 안 들은 곡 0</text>

        <rect class="n chg" x="20" y="620" width="220" height="56" rx="8"/>
        <text class="t" x="130" y="644" text-anchor="middle">장르 정하는 순서</text>
        <text class="s" x="130" y="662" text-anchor="middle">Last.fm → Discogs → Deezer …</text>

        <!-- 오른쪽 줄 -->
        <rect class="n chg" x="580" y="220" width="220" height="56" rx="8"/>
        <text class="t" x="690" y="244" text-anchor="middle">내 라이브러리 뮤지션</text>
        <text class="s" x="690" y="262" text-anchor="middle">가중치 상위 500명 · 신보 항상 앞</text>

        <rect class="n" x="580" y="420" width="220" height="56" rx="8"/>
        <text class="t" x="690" y="444" text-anchor="middle">AI 커넥터 · 웹진</text>
        <text class="s" x="690" y="462" text-anchor="middle">Deezer에서 있는지 확인</text>

        <rect class="n chg" x="580" y="720" width="220" height="56" rx="8"/>
        <text class="t" x="690" y="744" text-anchor="middle">AI·웹진 거르기</text>
        <text class="s" x="690" y="762" text-anchor="middle">일반 추천 하위 25% 선 미만 숨김</text>

        <!-- 가운데 화살표 -->
        <line class="e" x1="410" y1="76" x2="410" y2="118" marker-end="url(#ar)"/>
        <text class="l" x="418" y="102">많이 듣고 좋아한</text>
        <line class="e" x1="410" y1="176" x2="410" y2="218" marker-end="url(#ar)"/>
        <text class="l" x="418" y="202">연관 아티스트</text>
        <line class="e" x1="410" y1="276" x2="410" y2="318" marker-end="url(#ar)"/>
        <text class="l" x="418" y="302">디스코그래피</text>
        <line class="e" x1="410" y1="376" x2="410" y2="418" marker-end="url(#ar)"/>
        <text class="l" x="418" y="402">30초 미리듣기</text>
        <line class="e" x1="410" y1="476" x2="410" y2="518" marker-end="url(#ar)"/>
        <text class="l" x="418" y="502">닮음 · 좋아요/별로 닮음</text>
        <line class="e" x1="410" y1="576" x2="410" y2="618" marker-end="url(#ar)"/>
        <text class="l" x="418" y="602">점수 높은 순</text>
        <line class="e" x1="410" y1="676" x2="410" y2="718" marker-end="url(#ar)"/>
        <text class="l" x="418" y="702">칸마다 묶기</text>

        <!-- 라이브러리 → 내 곡 소리 기준 → 분석 -->
        <polyline class="e" points="300,48 130,48 130,118" marker-end="url(#ar)"/>
        <text class="l" x="140" y="40">전 곡 소리 (처음 한 번)</text>
        <polyline class="e" points="130,176 130,448 298,448" marker-end="url(#ar)"/>
        <text class="l" x="140" y="438">비교 기준 (가장 닮은 20곡)</text>

        <!-- 라이브러리 → 뮤지션 → 발매작 -->
        <polyline class="e" points="520,48 690,48 690,218" marker-end="url(#ar)"/>
        <text class="l" x="530" y="40">곡 2곡 이상·하트</text>
        <polyline class="e" points="690,276 690,348 522,348" marker-end="url(#ar)"/>
        <text class="l" x="540" y="338">항상 포함</text>

        <!-- AI → 분석 -->
        <line class="e" x1="580" y1="448" x2="522" y2="448" marker-end="url(#ar)"/>

        <!-- 장르 순서 → 장르 칸 -->
        <line class="e" x1="240" y1="648" x2="298" y2="648" marker-end="url(#ar)"/>

        <!-- 거르기 → 화면 -->
        <line class="e dash" x1="580" y1="748" x2="522" y2="748" marker-end="url(#ar)"/>
      </svg>
